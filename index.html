<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aethel Pet Naming | 🐾 Premium AI Naming for Dogs</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* --- 整体页面重塑 (大气、现代) --- */
  :root {
    --primary-color: #0a192f; /* 深海军蓝 */
    --accent-color: #d4af37;  /* 奢华金 */
    --accent-hover: #b99831;
    --background-color: #f8fafc; /* 极淡灰 */
    --card-background: #ffffff;
    --text-main: #334155;
    --font-stack: 'Montserrat', sans-serif;
  }

  body {
    background-color: var(--background-color);
    font-family: var(--font-stack);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    color: var(--text-main);
    flex-direction: column;
    perspective: 1500px; /* 为所有交互动效奠定 3D 基础 */
    -webkit-font-smoothing: antialiased;
  }

  /* --- 交互式卡片核心样式 --- */
  .container {
    background-color: var(--card-background);
    /* 移除幼稚的虚线，改为干净的实线边框 + 金色顶部装饰线 */
    border: 1px solid rgba(0,0,0,0.05);
    border-top: 4px solid var(--accent-color);
    border-radius: 12px;
    padding: 50px 40px;
    width: 90%; /* 响应式基础 */
    max-width: 480px; /* 桌面端最大宽度 */
    text-align: center;
    box-sizing: border-box;
    
    /* 深层柔和多层阴影，营造悬浮感 */
    box-shadow: 
      0 10px 15px -3px rgba(0, 0, 0, 0.05),
      0 4px 6px -2px rgba(0, 0, 0, 0.02),
      0 30px 40px -10px rgba(0, 0, 0, 0.08); /* 强化底部阴影 */

    /* 物理动效过渡时间 */
    transition: transform 0.3s ease-out, box-shadow 0.3s ease-out;
    transform-style: preserve-3d;
    backface-visibility: hidden;
  }

  /* --- 鼠标移动到卡片上/手机端点击时的物理回应 --- */
  .container:hover, .container:active {
    /* 微妙的 3D 旋转和轻微放大 */
    transform: translateY(-5px) scale(1.02) rotateY(-3deg) rotateX(1deg);
    /* 强化底部阴影以匹配悬浮高度 */
    box-shadow: 
      0 20px 25px -5px rgba(0, 0, 0, 0.08),
      0 10px 10px -5px rgba(0, 0, 0, 0.04),
      0 40px 60px -20px rgba(0, 0, 0, 0.15);
  }

  /* --- 卡片内元素设计 --- */
  h1 {
    color: var(--primary-color);
    font-size: 20px;
    font-weight: 700;
    margin: 0 0 40px 0;
    letter-spacing: 1.5px;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap; /* 适应手机端换行 */
  }
  h1 span {
    color: var(--accent-color);
    font-weight: 400;
    font-size: 14px;
    display: inline-block;
    margin-left: 10px;
    opacity: 0.8;
  }
  h1 p { display: none; } /* 移除原始幼稚Emoji */

  /* --- 输入组：干净、现代 --- */
  .input-group {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 30px;
    position: relative;
    transform: translateZ(20px); /* 提升深度，让用户觉得输入框离自己更近 */
  }

  input[type="text"] {
    flex: 1;
    padding: 16px 20px;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    outline: none;
    font-size: 15px;
    color: var(--text-main);
    transition: all 0.2s;
    background-color: #fbfcfe;
  }
  input[type="text"]:focus {
    border-color: var(--accent-color);
    background-color: #ffffff;
    box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
  }
  input[type="text"]::placeholder {
    color: #cbd5e1;
    opacity: 0.8;
  }

  /* 生成按钮：更专业、金色填充 */
  .generate-btn {
    width: 55px;
    height: 55px;
    flex-shrink: 0;
    border-radius: 10px; /* 移除圆形，改用倒角矩形，更硬朗大气 */
    background-color: var(--accent-color);
    color: white;
    border: none;
    cursor: pointer;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background-color 0.2s, transform 0.1s;
    box-shadow: 0 4px 6px -1px rgba(212, 175, 55, 0.3);
  }
  .generate-btn:hover {
    background-color: var(--accent-hover);
  }
  .generate-btn:active {
    transform: translateY(1px);
    box-shadow: 0 2px 4px -1px rgba(212, 175, 55, 0.2);
  }
  .generate-btn:disabled {
    background-color: #e2e8f0;
    cursor: not-allowed;
    box-shadow: none;
  }

  /* --- 结果方框：高端、质感 --- */
  .result-box {
    /* 采用深海军蓝背景，让结果以“金色和白色”呈现，更具高级感 */
    background-color: var(--primary-color);
    border-radius: 12px;
    min-height: 120px;
    display: flex;
    align-items: flex-start; /* 名字上对齐 */
    justify-content: flex-start;
    font-size: 15px;
    color: rgba(255,255,255,0.9); /* 白色文字用于寓意 */
    margin-bottom: 30px;
    padding: 25px 30px;
    line-height: 1.8;
    text-align: left;
    flex-direction: column;
    transform: translateZ(10px); /* 提升深度 */
    box-sizing: border-box;
  }
  .result-name {
    font-size: 28px;
    font-weight: 700;
    color: var(--accent-color); /* 金色文字用于名字 */
    margin-bottom: 15px;
    width: 100%;
    border-bottom: 1px solid rgba(255,255,255,0.1); /* 添加分割线 */
    padding-bottom: 10px;
  }

  /* Redo按钮：干净的 outlined 风格 */
  .redo-btn {
    background-color: transparent;
    color: var(--primary-color);
    border: 1.5px solid var(--primary-color);
    padding: 12px 36px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 500;
    text-transform: uppercase; /* 单词全大写，更硬朗专业 */
    letter-spacing: 1px;
    transition: all 0.2s ease;
    display: inline-block;
    margin: 0 auto;
    opacity: 0;
    pointer-events: none;
  }
  .redo-btn.show {
    opacity: 1;
    pointer-events: auto;
  }
  .redo-btn:hover {
    background-color: var(--primary-color);
    color: white;
  }
  .redo-btn:active {
    transform: translateY(1px);
  }

  /* --- 隐藏的 API 设置区 (保持用户安全做法) --- */
  .settings-box { margin-top: 30px; font-size: 11px; color: #cbd5e1; text-align: center; }
  .api-input { padding: 6px 12px; border: 1px solid rgba(0,0,0,0.1); border-radius: 6px; font-size: 11px; width: 180px; outline: none; margin-top: 8px; display: none; text-align: center; background-color: rgba(0,0,0,0.02); }
  .api-input:focus { border-color: var(--accent-color); background-color: #fff; }
  .settings-toggle { cursor: pointer; text-decoration: none; border-bottom: 1.5px dashed var(--accent-color); padding-bottom: 2px; }

  /* 加载动画 */
  .loading { color: rgba(255,255,255,0.6); text-align: center; font-style: italic; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

  /* --- 手机端适配 (Mobile First) --- */
  @media (max-width: 500px) {
    body { padding: 20px; } /* 增加页面整体边距，防止卡片贴边 */
    .container {
      padding: 40px 25px; /* 减少内边距 */
    }
    h1 {
      font-size: 18px; /* 缩小标题 */
      letter-spacing: 1px;
    }
    h1 span {
      font-size: 11px;
      margin-left: 0;
      margin-top: 5px;
      width: 100%; /* 换行 */
    }
    .input-group {
      flex-direction: column; /* 手机端输入和按钮垂直排列，适应屏幕宽度 */
      gap: 10px;
    }
    input[type="text"] {
      width: 100%;
      padding: 14px 18px;
      font-size: 14px;
    }
    .generate-btn {
      width: 100%; /* 按钮撑满 */
      border-radius: 8px;
    }
    .result-box {
      font-size: 14px;
      padding: 20px 20px;
    }
    .result-name {
      font-size: 24px;
    }
  }
</style>
</head>
<body>

<div class="container">
  <h1>Aethel Premium Naming 🐾 <span>AI 汪星人命名所</span></h1>
  
  <div class="input-group">
    <input type="text" id="impressionInput" placeholder="请输入核心特征或第一印象">
    <button class="generate-btn" id="generateBtn" title="唤醒灵感 ✨">✨</button>
  </div>

  <div class="result-box" id="resultBox">
    等待捕捉灵魂气息...
  </div>

  <button class="redo-btn" id="redoBtn">再想一个 ↺</button>
</div>

<div class="settings-box">
  <span class="settings-toggle" id="settingsToggle">⚙️ API 配置</span><br>
  <input type="password" id="apiKeyInput" class="api-input" placeholder="请输入有效 API 密钥">
</div>

<script>
  // =====================
  // *** 核心逻辑库保留 ***
  // =====================
  
  const generateBtn = document.getElementById('generateBtn');
  const redoBtn = document.getElementById('redoBtn');
  const resultBox = document.getElementById('resultBox');
  const impressionInput = document.getElementById('impressionInput');
  const settingsToggle = document.getElementById('settingsToggle');
  const apiKeyInput = document.getElementById('apiKeyInput');

  // 本地存储 API Key
  const savedKey = localStorage.getItem('dog_api_key_premium');
  if (savedKey) apiKeyInput.value = savedKey;

  settingsToggle.addEventListener('click', () => {
    apiKeyInput.style.display = apiKeyInput.style.display === 'block' ? 'none' : 'block';
  });
  apiKeyInput.addEventListener('change', (e) => {
    localStorage.setItem('dog_api_key_premium', e.target.value.trim());
  });

  async function generateName() {
    const impression = impressionInput.value.trim();
    const apiKey = apiKeyInput.value.trim();
    
    if (!impression) {
      resultBox.innerHTML = "<span style='color: #ffcccc;'>要先输入核心特征哦！</span>";
      return;
    }
    if (!apiKey) {
      resultBox.innerHTML = "<span style='color: #ffcccc;'>请先在页面底部设置 API 配置哦！</span>";
      apiKeyInput.style.display = 'block';
      return;
    }

    generateBtn.disabled = true;
    // 适配结果框的高端背景色
    resultBox.innerHTML = "<span class='loading'>📡 正在连线汪星，获取灵感...</span>";

    try {
      // 仍然使用 DeepSeek API 示例
      const response = await fetch('https://api.deepseek.com/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${apiKey}`
        },
        body: JSON.stringify({
          model: "deepseek-chat",
          messages: [
            { 
              role: "system", 
              // 这里的 Prompt 也针对高端风格做了微调
              content: "你是一个富有诗意、现代且脑洞大开的顶级宠物起名大师。请根据用户输入的第一印象，给小狗起一个有灵性、不落俗套且具有寓意的名字。名字可以是诗意古风、现代英文、日系清爽风或小众语种发音。请直接返回两行结果，格式必须严格且仅有：第一行是【名字】（如有外语拼写请附带），第二行是一段充满温度或故事感的【寓意解释】（不超过60个字）。不要输出任何废话。" 
            },
            { role: "user", content: `会对这只小狗的核心印象是：${impression}` }
          ],
          temperature: 0.8
        })
      });

      if (!response.ok) throw new Error('API 调用失败');

      const data = await response.json();
      const aiReply = data.choices[0].message.content.trim();
      
      const parts = aiReply.split('\n');
      const name = parts[0] || "未命名";
      const meaning = parts.slice(1).join('<br>') || "无需多言，就是缘分。";

      // 填充升级后的结果 HTML
      resultBox.innerHTML = `<div class="result-name">${name}</div><div>${meaning}</div>`;
      redoBtn.classList.add('show');
      impressionInput.value = ''; 

    } catch (error) {
      console.error(error);
      resultBox.innerHTML = `<span style='color: #ffcccc;'>呼叫失败：可能是网络或配置问题</span>`;
    } finally {
      generateBtn.disabled = false;
    }
  }

  generateBtn.addEventListener('click', generateName);
  impressionInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') generateName();
  });

  redoBtn.addEventListener('click', () => {
    resultBox.innerHTML = '等待捕捉灵魂气息...'; 
    redoBtn.classList.remove('show'); 
    impressionInput.focus(); 
  });
</script>

</body>
</html>
