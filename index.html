<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小狗起名器 🐾</title>
<style>
  /* 页面样式保持不变，依旧是温馨日系风 */
  body { background-color: #FFF9E6; font-family: 'M PLUS Rounded 1c', 'Comic Sans MS', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: #5c5c5c; }
  .container { background-color: #FFFFFF; border: 3px dashed #87CEEB; border-radius: 24px; padding: 40px; width: 320px; text-align: center; box-shadow: 0 10px 20px rgba(135, 206, 235, 0.15); }
  h1 { color: #87CEEB; font-size: 22px; margin-bottom: 30px; letter-spacing: 2px; }
  .input-group { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 25px; }
  input { flex: 1; padding: 14px 18px; border: 2px solid #FFE4B5; border-radius: 25px; outline: none; font-size: 15px; transition: all 0.3s ease; }
  input:focus { border-color: #87CEEB; }
  input::placeholder { color: #c9c9c9; }
  .generate-btn { width: 50px; height: 50px; flex-shrink: 0; border-radius: 50%; background-color: #87CEEB; color: white; border: none; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 8px rgba(135, 206, 235, 0.4); transition: transform 0.2s ease, background-color 0.2s; }
  .generate-btn:hover { transform: scale(1.08); background-color: #6CB4EE; }
  .result-box { background-color: #F0F8FF; min-height: 80px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; color: #4682B4; margin-bottom: 25px; border: 2px solid #FFF0C2; padding: 15px; line-height: 1.5; }
  .redo-btn { background-color: #FFE4B5; color: #8B7355; border: none; padding: 10px 32px; border-radius: 20px; font-size: 15px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 8px rgba(255, 228, 181, 0.4); transition: all 0.2s ease; display: block; margin: 0 auto; opacity: 0; pointer-events: none; }
  .redo-btn.show { opacity: 1; pointer-events: auto; }
  .redo-btn:hover { background-color: #FFDAB9; transform: translateY(-2px); }
</style>
</head>
<body>

<div class="container">
  <h1>汪星人命名所 🐾</h1>
  <div class="input-group">
    <input type="text" id="impressionInput" placeholder="输入第一印象 (如: 贪吃, 黑色, 呆萌)">
    <button class="generate-btn" id="generateBtn" title="生成名字">✨</button>
  </div>
  <div class="result-box" id="resultBox">等待捕捉灵感...</div>
  <button class="redo-btn" id="redoBtn">Redo ↺</button>
</div>

<script>
  // --- 名字词库库 ---
  const dictionary = {
    food: {
      keywords: ["吃", "饿", "馋", "胖", "肉", "圆"],
      names: ["饭团 (Onigiri)", "曲奇 (Cookie)", "布丁 (Pudding)", "麻薯 (Mochi)", "五花肉", "柚子 (Yuzu)"]
    },
    colorBlack: {
      keywords: ["黑", "暗", "炭", "煤"],
      names: ["黑豆 (Kuromame)", "芝麻 (Goma)", "煤球", "可乐", "奥利奥"]
    },
    colorWhite: {
      keywords: ["白", "雪", "云", "光"],
      names: ["雪球 (Yuki)", "棉花糖", "豆腐 (Tofu)", "大白", "牛奶"]
    },
    active: {
      keywords: ["皮", "闹", "活泼", "凶", "叫", "跑"],
      names: ["闪电 (Flash)", "小霸王", "火箭", "蹦蹦", "Taro (太郎)"]
    },
    cute: {
      keywords: ["萌", "软", "可爱", "乖", "静"],
      names: ["啵啵", "糯米", "Kinako (黄豆粉)", "团子", "Muku (姆库)"]
    }
  };

  const genericPrefixes = ["小", "阿", "胖", "糯", "布"];
  const genericSuffixes = ["酱", "球", "丁", "吉", "兜"];

  const generateBtn = document.getElementById('generateBtn');
  const redoBtn = document.getElementById('redoBtn');
  const resultBox = document.getElementById('resultBox');
  const impressionInput = document.getElementById('impressionInput');

  function generateName() {
    const impression = impressionInput.value.trim();
    
    if (!impression) {
      resultBox.innerHTML = "<span style='font-size:16px; color:#ff9999;'>要先输入印象哦！</span>";
      return;
    }

    let matchedCategory = null;

    // 1. 检查输入是否匹配关键词
    for (const key in dictionary) {
      const category = dictionary[key];
      // 如果输入的词里包含了关键词库里的某个字/词
      if (category.keywords.some(kw => impression.includes(kw))) {
        matchedCategory = category;
        break;
      }
    }

    let finalName = "";

    // 2. 根据匹配结果生成名字
    if (matchedCategory) {
      // 匹配到了特定分类
      const randomName = matchedCategory.names[Math.floor(Math.random() * matchedCategory.names.length)];
      finalName = `看来是个${impression}的小家伙！<br>叫它「${randomName}」怎么样？`;
    } else {
      // 没匹配到关键词，走通用可爱逻辑
      const randomChoice = Math.random();
      if (randomChoice > 0.5) {
        const prefix = genericPrefixes[Math.floor(Math.random() * genericPrefixes.length)];
        finalName = `太特别啦！<br>不如就叫「${prefix}${impression}」吧！`;
      } else {
        const suffix = genericSuffixes[Math.floor(Math.random() * genericSuffixes.length)];
        finalName = `感觉是个独立的小狗！<br>叫「${impression}${suffix}」很合适哦！`;
      }
    }

    resultBox.innerHTML = finalName;
    redoBtn.classList.add('show');
    impressionInput.value = ''; // 输入后清空输入框
  }

  generateBtn.addEventListener('click', generateName);
  impressionInput.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') generateName();
  });

  redoBtn.addEventListener('click', function() {
    resultBox.innerHTML = '等待捕捉灵感...'; 
    redoBtn.classList.remove('show'); 
    impressionInput.focus(); 
  });
</script>

</body>
</html>
