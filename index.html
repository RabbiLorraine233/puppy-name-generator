<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小狗起名器 🐾 (AI 驱动版)</title>
<style>
  body { background-color: #FFF9E6; font-family: 'M PLUS Rounded 1c', 'Comic Sans MS', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: #5c5c5c; flex-direction: column; }
  .container { background-color: #FFFFFF; border: 3px dashed #87CEEB; border-radius: 24px; padding: 40px; width: 340px; text-align: center; box-shadow: 0 10px 20px rgba(135, 206, 235, 0.15); position: relative; }
  h1 { color: #87CEEB; font-size: 22px; margin-bottom: 30px; letter-spacing: 2px; }
  
  .input-group { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 25px; }
  input[type="text"] { flex: 1; padding: 14px 18px; border: 2px solid #FFE4B5; border-radius: 25px; outline: none; font-size: 15px; transition: all 0.3s ease; }
  input[type="text"]:focus { border-color: #87CEEB; }
  
  .generate-btn { width: 50px; height: 50px; flex-shrink: 0; border-radius: 50%; background-color: #87CEEB; color: white; border: none; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 8px rgba(135, 206, 235, 0.4); transition: transform 0.2s ease, background-color 0.2s; }
  .generate-btn:hover { transform: scale(1.08); background-color: #6CB4EE; }
  
  .result-box { background-color: #F0F8FF; min-height: 100px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 16px; color: #4682B4; margin-bottom: 25px; border: 2px solid #FFF0C2; padding: 20px; line-height: 1.6; text-align: left; flex-direction: column; }
  .result-name { font-size: 24px; font-weight: bold; color: #ff9800; margin-bottom: 10px; text-align: center; width: 100%; }
  
  .redo-btn { background-color: #FFE4B5; color: #8B7355; border: none; padding: 10px 32px; border-radius: 20px; font-size: 15px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 8px rgba(255, 228, 181, 0.4); transition: all 0.2s ease; display: block; margin: 0 auto; opacity: 0; pointer-events: none; }
  .redo-btn.show { opacity: 1; pointer-events: auto; }
  
  /* 隐藏的 API 设置区 */
  .settings-box { margin-top: 20px; font-size: 12px; color: #aaa; text-align: center; }
  .api-input { padding: 6px 10px; border: 1px solid #ccc; border-radius: 10px; font-size: 12px; width: 200px; outline: none; margin-top: 5px; display: none; }
  .settings-toggle { cursor: pointer; text-decoration: underline; }
  
  /* 加载动画 */
  .loading { animation: pulse 1.5s infinite; }
  @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
</style>
</head>
<body>

<div class="container">
  <h1>汪星人命名所 🐾</h1>
  
  <div class="input-group">
    <input type="text" id="impressionInput" placeholder="输入第一印象 (如: 胆怯的黑狗)">
    <button class="generate-btn" id="generateBtn" title="呼叫 AI">✨</button>
  </div>

  <div class="result-box" id="resultBox">
    等待捕捉灵感...
  </div>

  <button class="redo-btn" id="redoBtn">再想一个 ↺</button>
</div>

<div class="settings-box">
  <span class="settings-toggle" id="settingsToggle">⚙️ 设置 API Key</span><br>
  <input type="password" id="apiKeyInput" class="api-input" placeholder="输入 DeepSeek API Key">
</div>

<script>
  const generateBtn = document.getElementById('generateBtn');
  const redoBtn = document.getElementById('redoBtn');
  const resultBox = document.getElementById('resultBox');
  const impressionInput = document.getElementById('impressionInput');
  const settingsToggle = document.getElementById('settingsToggle');
  const apiKeyInput = document.getElementById('apiKeyInput');

  // 本地存储 API Key，刷新不丢失
  const savedKey = localStorage.getItem('dog_api_key');
  if (savedKey) apiKeyInput.value = savedKey;

  // 展开/收起设置
  settingsToggle.addEventListener('click', () => {
    apiKeyInput.style.display = apiKeyInput.style.display === 'block' ? 'none' : 'block';
  });
  apiKeyInput.addEventListener('change', (e) => {
    localStorage.setItem('dog_api_key', e.target.value.trim());
  });

  async function generateName() {
    const impression = impressionInput.value.trim();
    const apiKey = apiKeyInput.value.trim();
    
    if (!impression) {
      resultBox.innerHTML = "<span style='color:#ff9999;'>要先输入印象哦！</span>";
      return;
    }
    if (!apiKey) {
      resultBox.innerHTML = "<span style='color:#ff9999;'>请先在页面底部设置 API Key 才能唤醒 AI 哦！</span>";
      apiKeyInput.style.display = 'block';
      return;
    }

    // 变为加载状态
    generateBtn.disabled = true;
    resultBox.innerHTML = "<span class='loading'>正在连线汪星，获取灵感... 📡<br>（AI 思考中，请稍候）</span>";

    try {
      // 这里调用的是 DeepSeek 的接口，兼容 OpenAI 格式
      const response = await fetch('https://api.deepseek.com/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${apiKey}`
        },
        body: JSON.stringify({
          model: "deepseek-chat",
          messages: [
            { 
              role: "system", 
              // 这里的 Prompt (提示词) 注入了高级感、日系风和故事感，你可以随时自己修改这里！
              content: "你是一个富有诗意且脑洞大开的宠物起名大师。请根据用户输入的第一印象，给小狗起一个有灵性、不落俗套的名字。可以偏向日系风、热血动漫感或小众语种发音。请直接返回结果，格式必须为两行：第一行是【名字】（如有外语拼写请附带），第二行是一段充满温度或故事感的【寓意解释】。不要输出其他废话。" 
            },
            { role: "user", content: `我对这只小狗的第一印象是：${impression}` }
          ],
          temperature: 0.8 // 这个数值越高，AI 脑洞越大 (0.0 到 2.0 之间)
        })
      });

      if (!response.ok) throw new Error('API 调用失败，可能是 Key 填错了或者余额不足');

      const data = await response.json();
      const aiReply = data.choices[0].message.content.trim();
      
      // 解析 AI 的回答，提取名字和寓意进行排版
      const parts = aiReply.split('\n');
      const name = parts[0] || "未命名";
      const meaning = parts.slice(1).join('<br>') || "无需多言，就是缘分。";

      resultBox.innerHTML = `<div class="result-name">${name}</div><div>${meaning}</div>`;
      redoBtn.classList.add('show');
      impressionInput.value = ''; 

    } catch (error) {
      console.error(error);
      resultBox.innerHTML = `<span style='color:#ff9999;'>呼叫失败：${error.message}</span>`;
    } finally {
      generateBtn.disabled = false;
    }
  }

  generateBtn.addEventListener('click', generateName);
  impressionInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') generateName();
  });

  redoBtn.addEventListener('click', () => {
    resultBox.innerHTML = '等待捕捉灵感...'; 
    redoBtn.classList.remove('show'); 
    impressionInput.focus(); 
  });
</script>

</body>
</html>
